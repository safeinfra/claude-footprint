name: commit-lint

# Enforce Conventional Commits on PRs so bump-version can read them.
# Checks every non-merge commit in the PR plus the PR title (used on squash merge).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit subjects and PR title
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|docs|test|chore|ci|build|style|revert)(\([a-z0-9._/-]+\))?!?: .+'
          bad=0
          while IFS= read -r line; do
            sha=${line%% *}; subject=${line#* }
            if ! printf '%s' "$subject" | grep -qE "$re"; then
              echo "::error::${sha:0:7} bad commit subject: $subject"; bad=1
            fi
          done < <(git log --no-merges --format='%H %s' "$BASE..$HEAD")
          if ! printf '%s' "$TITLE" | grep -qE "$re"; then
            echo "::error::bad PR title: $TITLE"; bad=1
          fi
          if [ "$bad" = 1 ]; then
            echo "Expected: <type>(<scope>)?!?: <subject>  types: feat fix perf refactor docs test chore ci build style revert"
            exit 1
          fi
